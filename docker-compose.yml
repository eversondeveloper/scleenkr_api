services:
  db:
    image: postgres:15-alpine
    container_name: postgres_scleenkr
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  cache:
    image: redis:latest
    container_name: redis_scleenkr
    restart: always
    ports:
     - "6379:6379"
    volumes:
     - redis_data:/data

volumes:
  pgdata:
  redis_data: